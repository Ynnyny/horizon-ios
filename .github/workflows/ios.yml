name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, ios]
    tags: ["ios-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-aarch64

      - name: Configure the iOS SDK
        run: |
          set -eu
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "IPHONEOS_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_apple_ios=clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_apple_ios=clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_apple_ios=ar" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_apple_ios=-isysroot $SDKROOT -miphoneos-version-min=14.0 -fembed-bitcode" >> "$GITHUB_ENV"
          echo "CXXFLAGS_aarch64_apple_ios=-isysroot $SDKROOT -miphoneos-version-min=14.0 -fembed-bitcode" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-isysroot -C link-arg=$SDKROOT -C link-arg=-miphoneos-version-min=14.0 -C link-arg=-Wl,-install_name,@rpath/libhorizon_ios.dylib" >> "$GITHUB_ENV"

      - name: Build Horizon for iOS
        run: |
          cargo build -p horizon-ios --release --target aarch64-apple-ios

      - name: Check the artifacts
        run: |
          set -eu
          file target/aarch64-apple-ios/release/libhorizon_ios.a
          file target/aarch64-apple-ios/release/libhorizon_ios.dylib
          lipo -info target/aarch64-apple-ios/release/libhorizon_ios.a
          nm -gU target/aarch64-apple-ios/release/libhorizon_ios.a | grep -q '_horizon_ios_start$'
          nm -gU target/aarch64-apple-ios/release/libhorizon_ios.a | grep -q '_horizon_ios_abi_version$'

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp target/aarch64-apple-ios/release/libhorizon_ios.a dist/
          cp target/aarch64-apple-ios/release/libhorizon_ios.dylib dist/
          codesign --force --sign - dist/libhorizon_ios.dylib
          nm -gU dist/libhorizon_ios.a > dist/horizon-ios-symbols.txt
          case "$GITHUB_REF_NAME" in
            ios-v*) version="${GITHUB_REF_NAME#ios-v}" ;;
            *) version="0.1.0" ;;
          esac
          a="$(shasum -a 256 dist/libhorizon_ios.a | cut -d' ' -f1)"
          d="$(shasum -a 256 dist/libhorizon_ios.dylib | cut -d' ' -f1)"
          cat > dist/horizon-ios.json <<EOF
          {
            "format": 1,
            "id": "horizon-ios",
            "version": "$version",
            "abi": 1,
            "min_ios": "14.0",
            "arch": "arm64",
            "staticlib": {"path": "libhorizon_ios.a", "sha256": "$a"},
            "dylib": {"path": "libhorizon_ios.dylib", "sha256": "$d"},
            "source": "https://github.com/${{ github.repository }}"
          }
          EOF
          shasum -a 256 dist/libhorizon_ios.a dist/libhorizon_ios.dylib > dist/SHA256SUMS
          cat dist/horizon-ios.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Horizon iOS runtime.

            - `libhorizon_ios.a`: static library (link into the launcher).
            - `libhorizon_ios.dylib`: runtime library, ad-hoc signed.
            - `horizon-ios.json`: manifest and SHA-256 checksums.
            - `SHA256SUMS`: checksums.
            - `horizon-ios-symbols.txt`: exported C ABI.
